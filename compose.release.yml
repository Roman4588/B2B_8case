# Use with docker compose -f docker-compose.yml -f compose.release.yml up -d --no-build
x-release-backend: &release-backend
  image: ghcr.io/roman4588/b2b_8case/backend:${SIGNALIS_VERSION:?Set SIGNALIS_VERSION to a published release tag}
services:
  init:
    <<: *release-backend
  api:
    <<: *release-backend
  worker:
    <<: *release-backend
  beat:
    <<: *release-backend
  frontend:
    image: ghcr.io/roman4588/b2b_8case/frontend:${SIGNALIS_VERSION:?Set SIGNALIS_VERSION}
  demo-exporter:
    image: ghcr.io/roman4588/b2b_8case/demo-exporter:${SIGNALIS_VERSION:?Set SIGNALIS_VERSION}
