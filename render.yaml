services:
  - type: web
    name: b2b8case-frontend
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    healthCheckPath: /

  - type: web
    # Keep the service name aligned with frontend/deploy/nginx.conf.
    name: api
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: /bin/sh -c 'python -m app.bootstrap && uvicorn app.main:app --host 0.0.0.0 --port 8000'
    healthCheckPath: /api/health/live
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: b2b8case-db
          property: connectionString
      - key: REDIS_URL
        value: redis://127.0.0.1:65533/0
      - key: PROMETHEUS_URL
        value: http://127.0.0.1:65535
      - key: DEMO_EXPORTER_URL
        value: http://127.0.0.1:65534
      - key: DEMO_MODE
        value: "true"
      - key: SESSION_SECURE
        value: "true"
      - key: MODEL_CACHE
        value: /data/models
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: POSTGRES_PASSWORD
        sync: false

databases:
  - name: b2b8case-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "17"
    databaseName: copilot
    user: copilot
