services:
  - type: web
    name: b2b8case-frontend
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    healthCheckPath: /

  - type: web
    name: b2b8case-api
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: /bin/sh -c 'python -m app.bootstrap && uvicorn app.main:app --host 0.0.0.0 --port 8000'
    healthCheckPath: /api/health/live
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: b2b8case-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: b2b8case-redis
          property: connectionString
      - key: PROMETHEUS_URL
        value: http://b2b8case-prometheus:9090
      - key: DEMO_EXPORTER_URL
        value: http://b2b8case-demo-exporter:9101
      - key: DEMO_MODE
        value: "true"
      - key: SESSION_SECURE
        value: "true"
      - key: MODEL_CACHE
        value: /data/models
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: POSTGRES_PASSWORD
        sync: false

  - type: worker
    name: b2b8case-worker
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.tasks.celery worker --pool=threads --concurrency=2 --loglevel=INFO
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: b2b8case-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: b2b8case-redis
          property: connectionString
      - key: PROMETHEUS_URL
        value: http://b2b8case-prometheus:9090
      - key: DEMO_MODE
        value: "true"
      - key: MODEL_CACHE
        value: /data/models
      - key: UPLOAD_DIR
        value: /data/uploads

  - type: worker
    name: b2b8case-beat
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.tasks.celery beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: b2b8case-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: b2b8case-redis
          property: connectionString
      - key: PROMETHEUS_URL
        value: http://b2b8case-prometheus:9090
      - key: DEMO_MODE
        value: "true"

  - type: pserv
    name: b2b8case-prometheus
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./deploy/prometheus/Dockerfile
    dockerContext: .

  - type: pserv
    name: b2b8case-demo-exporter
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./deploy/demo-exporter/Dockerfile
    dockerContext: ./deploy/demo-exporter

  - type: keyvalue
    name: b2b8case-redis
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList:
      - source: 0.0.0.0/0
        description: Render private network

databases:
  - name: b2b8case-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "17"
    databaseName: copilot
    user: copilot
