name: Verify case 8
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_EMAIL: e2e@example.org
      E2E_PASSWORD: Only-for-tests-2026
    steps:
      - uses: actions/checkout@v5
      - name: Build and start real stack
        run: |
          docker compose up --build -d --wait
          docker compose exec -T -e ADMIN_EMAIL="$E2E_EMAIL" -e ADMIN_PASSWORD="$E2E_PASSWORD" api python -m app.manage create-admin --non-interactive
      - name: Backend and real pgvector tests
        run: docker compose --profile test run --build --rm tests
      - name: Classifier benchmark
        run: docker compose --profile test run --rm --no-deps tests python scripts/evaluate.py --output /tmp/classification-report.json
      - name: Install browser and smoke dependencies
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install httpx reportlab
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify HTTP workflow and large PDF
        run: .ci-venv/bin/python scripts/smoke.py
      - name: Verify browser workflow
        working-directory: frontend
        run: npm run test:e2e
      - name: Diagnostics
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop stack
        if: always()
        run: docker compose down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            docs/smoke-report.json
            frontend/test-results/
