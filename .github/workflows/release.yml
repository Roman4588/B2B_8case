name: Publish release images
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Image names
        run: echo "IMAGE_ROOT=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: runtime
          push: true
          tags: ${{ env.IMAGE_ROOT }}/backend:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_ROOT }}/frontend:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: deploy/demo-exporter
          push: true
          tags: ${{ env.IMAGE_ROOT }}/demo-exporter:${{ github.ref_name }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "Сигналис — кейс 8 $GITHUB_REF_NAME" --notes-file docs/release-notes.md
